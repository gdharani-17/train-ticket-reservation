
name: CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

jobs:

  # 1. Build Application
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build WAR with Maven
      - name: Validate
        run: mvn validate

      - name: Compile
        run: mvn compile

      - name: Test
        run: mvn test

      - name: Package
        run: mvn package

      # 4. Verify WAR file
      - name: Verify WAR file
        run: ls -lh target/

      # 5. Upload artifact
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war

  # 2. Deploy DEV
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact

      - name: Deploy to Tomcat DEV
        run: |
          curl --fail --show-error --silent \
            -u "${{ secrets.TOMCAT_USER_DEV }}:${{ secrets.TOMCAT_PASS_DEV }}" \
            -T ./artifact/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${{ secrets.TOMCAT_URL_DEV }}:8080/manager/text/deploy?path=/TrainBook&update=true"

  # 3. Deploy QA
  deploy-qa:
    name: Deploy QA
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact

      - name: Deploy to Tomcat QA
        run: |
          curl --fail --show-error --silent \
            -u "${{ secrets.TOMCAT_USER_TEST }}:${{ secrets.TOMCAT_PASS_TEST }}" \
            -T ./artifact/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${{ secrets.TOMCAT_URL_TEST }}:8080/manager/text/deploy?path=/TrainBook&update=true"

  # 4. Deploy PrePROD
  deploy-preprod:
    name: Deploy PrePROD
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: preprod

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact

      - name: Deploy to Tomcat PrePROD
        run: |
          curl --fail --show-error --silent \
            -u "${{ secrets.TOMCAT_USER_PRE_PROD }}:${{ secrets.TOMCAT_PASS_PRE_PROD }}" \
            -T ./artifact/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${{ secrets.TOMCAT_URL_PRE_PROD }}:8080/manager/text/deploy?path=/TrainBook&update=true"

  # 5. Deploy PROD
  deploy-prod:
    name: Deploy PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact

      - name: Deploy to Tomcat PROD
        run: |
          curl --fail --show-error --silent \
            -u "${{ secrets.TOMCAT_USER_PROD }}:${{ secrets.TOMCAT_PASS_PROD }}" \
            -T ./artifact/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${{ secrets.TOMCAT_URL_PROD }}:8080/manager/text/deploy?path=/TrainBook&update=true"

