name: CI/CD Pipeline
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
jobs:
  # 1. BUILD APPLICATION
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Validate
        run: mvn validate
      - name: Compile
        run: mvn compile
      - name: Test
        run: mvn test
      - name: Package
        run: mvn package
      - name: Verify WAR file
        run: ls -lh target/*.war
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war
  # 2. DEPLOY DEV
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat DEV
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_DEV }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_DEV }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          set -euo pipefail
          WAR_FILE=$(find ./artifact -name '*.war' -print -quit)
          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi
          BASE_URL="${TOMCAT_URL%/}"
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) BASE_URL="http://$BASE_URL" ;;
          esac
          AUTHORITY="${BASE_URL#*://}"
          AUTHORITY="${AUTHORITY%%/*}"
          if [[ "$AUTHORITY" != *:* ]]; then
            BASE_URL="${BASE_URL}:8080"
          fi
          curl --fail --show-error --silent \
            -u "$TOMCAT_USER:$TOMCAT_PASS" \
            -T "$WAR_FILE" \
            "$BASE_URL/manager/text/deploy?path=/TrainBook&update=true"
  # 3. DEPLOY QA / TEST
  deploy-qa:
    name: Deploy QA
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat QA
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_TEST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_TEST }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_TEST }}
        run: |
          set -euo pipefail
          WAR_FILE=$(find ./artifact -name '*.war' -print -quit)
          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi
          BASE_URL="${TOMCAT_URL%/}"
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) BASE_URL="http://$BASE_URL" ;;
          esac
          AUTHORITY="${BASE_URL#*://}"
          AUTHORITY="${AUTHORITY%%/*}"
          if [[ "$AUTHORITY" != *:* ]]; then
            BASE_URL="${BASE_URL}:8080"
          fi
          curl --fail --show-error --silent \
            -u "$TOMCAT_USER:$TOMCAT_PASS" \
            -T "$WAR_FILE" \
            "$BASE_URL/manager/text/deploy?path=/TrainBook&update=true"
  # 4. DEPLOY PREPROD
  deploy-preprod:
    name: Deploy PrePROD
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat PrePROD
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_PRE_PROD }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_PRE_PROD }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_PRE_PROD }}
        run: |
          set -euo pipefail
          WAR_FILE=$(find ./artifact -name '*.war' -print -quit)
          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi
          BASE_URL="${TOMCAT_URL%/}"
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) BASE_URL="http://$BASE_URL" ;;
          esac
          AUTHORITY="${BASE_URL#*://}"
          AUTHORITY="${AUTHORITY%%/*}"
          if [[ "$AUTHORITY" != *:* ]]; then
            BASE_URL="${BASE_URL}:8080"
          fi
          curl --fail --show-error --silent \
            -u "$TOMCAT_USER:$TOMCAT_PASS" \
            -T "$WAR_FILE" \
            "$BASE_URL/manager/text/deploy?path=/TrainBook&update=true"
  # 5. DEPLOY PROD
  deploy-prod:
    name: Deploy PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact
      - name: Deploy to Tomcat PROD
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_PROD }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_PROD }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_PROD }}
        run: |
          set -euo pipefail
          WAR_FILE=$(find ./artifact -name '*.war' -print -quit)
          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found!"
            exit 1
          fi
          BASE_URL="${TOMCAT_URL%/}"
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) BASE_URL="http://$BASE_URL" ;;
          esac
          AUTHORITY="${BASE_URL#*://}"
          AUTHORITY="${AUTHORITY%%/*}"
          if [[ "$AUTHORITY" != *:* ]]; then
            BASE_URL="${BASE_URL}:8080"
          fi
          curl --fail --show-error --silent \
            -u "$TOMCAT_USER:$TOMCAT_PASS" \
            -T "$WAR_FILE" \
            "$BASE_URL/manager/text/deploy?path=/TrainBook&update=true"
